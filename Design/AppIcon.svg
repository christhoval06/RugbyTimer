<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 130 130">
  <title>RugbyTimer app icon</title>
  <!-- Full-bleed square: iOS and watchOS apply their own corner mask. -->
  <rect x="0" y="0" width="130" height="130" fill="#0B0E14"/>
  <!-- Countdown ring -->
  <circle cx="65" cy="65" r="44" fill="none" stroke="#1F2937" stroke-width="9"/>
  <circle cx="65" cy="65" r="44" fill="none" stroke="#10B981" stroke-width="9" stroke-linecap="round" stroke-dasharray="207 277" transform="rotate(-90 65 65)"/>
  <!-- Rugby ball: body, lower-half shading, panel seams, laces -->
  <g transform="translate(65 65) rotate(-35) scale(0.98)">
    <path d="M-33 0 C-25 -21 25 -21 33 0 C25 21 -25 21 -33 0 Z" fill="#F9FAFB"/>
    <path d="M-33 0 C-12 8 12 8 33 0 C25 21 -25 21 -33 0 Z" fill="#D1D5DB"/>
    <path d="M-33 0 C-12 -8 12 -8 33 0" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
    <path d="M-33 0 C-12 8 12 8 33 0" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
    <g stroke="#0B0E14" stroke-width="1.6" stroke-linecap="round">
      <line x1="-10" y1="-5.8" x2="10" y2="-5.8"/>
      <line x1="-8" y1="-8.6" x2="-8" y2="-3"/>
      <line x1="-4" y1="-9" x2="-4" y2="-2.8"/>
      <line x1="0" y1="-9.2" x2="0" y2="-2.6"/>
      <line x1="4" y1="-9" x2="4" y2="-2.8"/>
      <line x1="8" y1="-8.6" x2="8" y2="-3"/>
    </g>
  </g>
</svg>
